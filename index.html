<style>
:root{
  --bg:#F5F7FB;--surface:#FFFFFF;--ink:#141B2D;--muted:#586178;--line:#DCE2EE;
  --accent:#2547F5;--accent-ink:#FFFFFF;--soft:#EBEFFA;--hi:#FFD84D;--ok:#0F7B55;--bad:#B3261E;
  --code:#0E1527;--code-ink:#E3E9FF;--grid:rgba(37,71,245,.07);
  --excel:#1D7A46;--sql:#B15A00;--python:#2547F5;--powerbi:#A32C82;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1120;--surface:#141B30;--ink:#E8ECF8;--muted:#9AA5C0;--line:#26304C;
    --accent:#8AA0FF;--accent-ink:#0C1120;--soft:#1B2440;--ok:#4CD6A0;--bad:#FF8A80;
    --code:#080D1A;--grid:rgba(138,160,255,.07);
    --excel:#4CD68F;--sql:#F0A94E;--python:#8AA0FF;--powerbi:#E792CC;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1120;--surface:#141B30;--ink:#E8ECF8;--muted:#9AA5C0;--line:#26304C;
  --accent:#8AA0FF;--accent-ink:#0C1120;--soft:#1B2440;--ok:#4CD6A0;--bad:#FF8A80;
  --code:#080D1A;--grid:rgba(138,160,255,.07);
  --excel:#4CD68F;--sql:#F0A94E;--python:#8AA0FF;--powerbi:#E792CC;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px);-webkit-text-size-adjust:100%;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);height:100%}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.02em}
h1{font-weight:800;font-size:clamp(2rem,7vw,3.4rem)}
h2{font-weight:800;font-size:clamp(1.4rem,4.5vw,2rem);margin-bottom:.4rem}
h3{font-weight:600;font-size:1.08rem}
p{margin:0 0 .8rem}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto;padding:0 16px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 0}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;letter-spacing:-.03em;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--accent);position:relative}
.brand i::after{content:"";position:absolute;inset:5px;border:2px solid var(--accent-ink);border-radius:2px;border-right-color:transparent;border-bottom-color:transparent}
.prog{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted)}
.meter{width:80px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:none}
.meter b{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;flex:none}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{white-space:nowrap;border:1px solid transparent;background:none;padding:7px 12px;border-radius:8px;font-weight:500;color:var(--muted);flex:none}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs button:not([aria-current="page"]):hover{background:var(--soft);color:var(--ink)}

main{padding:26px 0 56px;min-height:70vh}
.sec-head{margin-bottom:18px}
.sec-head p{color:var(--muted);max-width:62ch}

.hero{display:grid;gap:26px;padding:6px 0 34px}
.hero-grid{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;border:1px solid var(--line);border-radius:14px;padding:22px 18px}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:54ch;margin:14px 0 20px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:9px;font-weight:600;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.5;cursor:not-allowed}

.streakbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.streak{display:inline-flex;align-items:center;gap:6px;font-weight:600;border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:99px;font-size:.85rem}
.banner{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;font-size:.9rem;margin:14px 0 0}

.toolgrid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin-top:16px}
.toolcard{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:13px 14px;text-align:left}
.toolcard b{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:1rem}
.toolcard .dot{width:9px;height:9px;border-radius:50%;flex:none}
.toolcard span{color:var(--muted);font-size:.86rem;display:block;margin-top:4px}

.list-table{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lt-row{display:flex;gap:14px;align-items:baseline;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.lt-row:last-child{border-bottom:0}
.lt-row:hover{background:var(--soft)}
.lt-row strong{min-width:120px;font-family:var(--display);font-size:1.02rem}
.lt-row span{color:var(--muted);font-size:.93rem}
.two{display:grid;gap:22px;margin-top:32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.chip{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink);margin:0 6px 6px 0;border:1px solid var(--line)}
.tchip{border-radius:99px;font-size:.72rem;font-weight:600;padding:2px 9px;color:#fff;display:inline-block}
.muted{color:var(--muted)}
.small{font-size:.87rem}

details.row{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.row>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
details.row>summary::-webkit-details-marker{display:none}
details.row>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s;flex:none}
details.row[open]>summary::after{transform:rotate(-135deg)}
details.row.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
details.row.done .ttl{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
.dn{font-family:var(--mono);font-size:.78rem;color:var(--muted);min-width:44px}
.ttl{font-weight:600}
.body{padding:2px 16px 16px 16px;border-top:1px solid var(--line)}
.body h4{margin:14px 0 4px;font-size:.9rem;font-family:var(--display)}
.body ul{margin:0;padding-left:1.1rem}
.body li{margin:2px 0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none;cursor:pointer}
label.ck{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
label.ck.on span{color:var(--muted);text-decoration:line-through}
.notes textarea{width:100%;font:inherit;font-size:.88rem;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);resize:vertical;min-height:56px;margin-top:4px}
.notes label{font-size:.82rem;color:var(--muted);font-weight:600}

.week-h{display:flex;align-items:center;gap:12px;margin:24px 0 10px;flex-wrap:wrap}
.week-h h3{font-size:1.2rem}
.week-h .meter{width:110px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);padding:5px 13px;border-radius:99px;font-size:.89rem;display:flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill .dot{width:7px;height:7px;border-radius:50%}
input[type=search],input[type=text],input[type=date],select,textarea{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
input[type=search]{flex:1 1 180px}

pre{background:var(--code);color:var(--code-ink);font:400 .83rem/1.55 var(--mono);padding:14px;border-radius:9px;overflow-x:auto;margin:6px 0 0;tab-size:2}
.cb{position:relative}
.cb .cp{position:absolute;top:12px;right:6px;border:1px solid #3a466b;background:#1a2340;color:#c9d3f5;border-radius:6px;font-size:.74rem;padding:2px 8px}
.cheat-grid{display:grid;gap:12px}
.cheat-grid .card h3{font-size:.96rem;margin-bottom:2px}

.qbox{max-width:680px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);padding:11px 14px;border-radius:9px;margin-bottom:8px;font-family:var(--mono);font-size:.86rem}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.expl{border-left:3px solid var(--accent);padding:4px 12px;margin:12px 0;background:var(--soft);border-radius:0 8px 8px 0}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.87rem;margin-bottom:8px}
.big{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
footer{border-top:1px solid var(--line);padding:20px 0 30px;color:var(--muted);font-size:.87rem}
.linkgrid{display:grid;gap:8px}
.linkgrid a{display:block;padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-decoration:none;color:var(--ink)}
.linkgrid a small{display:block;color:var(--muted)}
.linkgrid a:hover{border-color:var(--accent)}
.loading{padding:60px 0;text-align:center;color:var(--muted);font-family:var(--mono)}

.apptable{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:10px}
.apptable th,.apptable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.apptable th{color:var(--muted);font-weight:600;font-size:.78rem}
.appform{display:grid;gap:8px;grid-template-columns:1fr;margin-top:10px}
.status-pill{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.kw-yes{color:var(--ok);font-weight:600}
.kw-no{color:var(--bad)}
.kwgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sandbox textarea{width:100%;font-family:var(--mono);font-size:.85rem;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--code);color:var(--code-ink);min-height:110px}
.err{color:var(--bad);font-family:var(--mono);font-size:.83rem;white-space:pre-wrap;margin-top:8px}
.resultwrap{overflow-x:auto;margin-top:10px}
.resultwrap table{border-collapse:collapse;width:100%;font-size:.85rem}
.resultwrap th,.resultwrap td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-family:var(--mono)}
.resultwrap th{background:var(--bg);color:var(--muted);font-size:.75rem}
.iconbtn-row{display:flex;gap:6px}
.del{border:1px solid var(--line);background:var(--surface);border-radius:7px;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;color:var(--bad);flex:none}

@media (min-width:720px){
  .hero{grid-template-columns:1fr}
  .toolgrid{grid-template-columns:repeat(4,1fr)}
  .two{grid-template-columns:1fr 1fr}
  .cheat-grid{grid-template-columns:1fr 1fr}
  .linkgrid{grid-template-columns:1fr 1fr}
  .appform{grid-template-columns:1.4fr 1.4fr 1fr 1fr auto}
}
@media (max-width:480px){.toolgrid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="text/babel" data-presets="react">
const {useState,useEffect,useMemo,useRef} = React;

/* ---------------- persistence ---------------- */
function loadState(){
  const base={days:{},steps:{},career:{},cards:{},best:{},notes:{},apps:[],activity:{},startDate:null,quizWrong:{}};
  try{const r=localStorage.getItem('ap2');if(r)return Object.assign(base,JSON.parse(r))}catch(e){}
  return base;
}
function saveState(s){try{localStorage.setItem('ap2',JSON.stringify(s))}catch(e){}}
function toast(msg){
  const el=document.getElementById('toastEl');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),1300);
}
function copyText(t,btn){
  const done=()=>{const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1200)};
  try{navigator.clipboard.writeText(t).then(done,fallback)}catch(e){fallback()}
  function fallback(){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done()}catch(x){toast('Copy not available here')}
    ta.remove();
  }
}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}

  Excel:{color:'var(--excel)',blurb:'Spreadsheets, formulas, PivotTables and dashboards — the tool every analyst opens first.'},

};

/* ---------------- roadmap data ---------------- */
const EXCEL=[
['Interface & basic formulas',['Ribbon, cells, sheets and workbook basics','Number formats and cell formatting','SUM, AVERAGE, COUNT, COUNTA, MIN, MAX'],'Build a personal budget sheet with categories. Use SUM for totals and AVERAGE for monthly spend.'],
['Cell references & logical functions',['Relative vs absolute references ($A$1)','IF and nested IF','AND, OR combined with IF'],'Build a grading sheet: nested IF assigns A/B/C/F, and AND/OR flags students who need review.'],

['Aggregation',['COUNT, SUM, AVG, MIN, MAX','GROUP BY','HAVING vs WHERE'],'Compute total revenue and order count per category, then filter to categories over $10,000 with HAVING.'],
['JOINs',['INNER JOIN','LEFT JOIN','Joining 3+ tables, table aliases'],'Join customers, orders and order_items to find each customer\u2019s total spend.'],

/* ---- streak & today helpers ---- */
function computeStreak(activity){
  let n=0,d=new Date();
  const key=dt=>dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  if(!activity[key(d)]){ d.setDate(d.getDate()-1); if(!activity[key(d)]) return 0; }
  while(activity[key(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const SAMPLE_QUERIES=[
['Preview a table','SELECT * FROM customers;'],
['Revenue by category','SELECT category, ROUND(SUM(amount),2) AS revenue, COUNT(*) AS orders\nFROM orders\nGROUP BY category\nORDER BY revenue DESC;'],
['Join customers + orders','SELECT c.name, c.city, SUM(o.amount) AS total_spend\nFROM customers c\nJOIN orders o ON o.customer_id = c.id\nGROUP BY c.name, c.city\nORDER BY total_spend DESC;'],
['Rank customers within segment','SELECT c.segment, c.name, SUM(o.amount) AS spend,\n  RANK() OVER (PARTITION BY c.segment ORDER BY SUM(o.amount) DESC) AS rnk\nFROM customers c JOIN orders o ON o.customer_id = c.id\nGROUP BY c.segment, c.name;'],
['Customers with no orders','SELECT c.name FROM customers c\nLEFT JOIN orders o ON o.customer_id = c.id\nWHERE o.id IS NULL;'],
['Above-average spenders (CTE)','WITH totals AS (\n  SELECT customer_id, SUM(amount) AS total FROM orders GROUP BY customer_id\n)\nSELECT customer_id, total FROM totals\nWHERE total > (SELECT AVG(total) FROM totals)\nORDER BY total DESC;']
];
function SqlSandbox(){
  const [status,setStatus]=useState('loading');
  const [sqlObj,setSqlObj]=useState(null);
  const [query,setQuery]=useState(SAMPLE_QUERIES[1][1]);
  const [result,setResult]=useState(null);
  const [error,setError]=useState('');

  function freshDb(SQL){
    const db=new SQL.Database();
    db.run(SEED_SQL);
    return db;
  }

  useEffect(()=>{
    let cancelled=false;
    if(typeof initSqlJs==='undefined'){ setStatus('error'); return; }
    initSqlJs({locateFile:f=>`https://cdn.jsdelivr.net/npm/sql.js@1.10.3/dist/${f}`})
      .then(SQL=>{
        if(cancelled) return;
        const db=freshDb(SQL);
        setSqlObj({SQL,db});
        setStatus('ready');
      })
      .catch(()=>{ if(!cancelled) setStatus('error'); });
    return ()=>{cancelled=true};
  },[]);

  function run(){
    if(!sqlObj) return;
    setError('');
    try{
      const res=sqlObj.db.exec(query);
      if(res.length===0){ setResult({columns:[],values:[]}); toast('Query ran \u2014 no rows returned'); }
      else setResult(res[res.length-1]);
    }catch(e){
      setError(e.message||String(e));
      setResult(null);
    }
  }
  function resetDb(){
    if(!sqlObj) return;
    try{
      sqlObj.db.close();
    }catch(e){}
    const db=freshDb(sqlObj.SQL);
    setSqlObj({...sqlObj,db});
    setResult(null);setError('');
    toast('Database reset');
  }

  return (
    <div>
      <div className="sec-head"><h2>SQL Sandbox</h2><p>A real SQLite database, running entirely in your browser (via sql.js / WebAssembly). Two tables are preloaded: <code>customers</code> and <code>orders</code>. Write a query and run it.</p></div>
      {status==='loading' && <div className="card">Loading the in-browser database engine\u2026</div>}
      {status==='error' && <div className="card">Couldn\u2019t load the SQL engine (this needs internet access to a CDN). Use the SQL cheatsheet and the coding exercises instead.</div>}
      {status==='ready' && (
        <div className="sandbox">
          <div className="filters">
            {SAMPLE_QUERIES.map(([label,q])=>(
              <button key={label} className="pill" onClick={()=>setQuery(q)}>{label}</button>
            ))}
          </div>
          <textarea value={query} onChange={e=>setQuery(e.target.value)} spellCheck="false"/>
          <div className="cta" style={{marginTop:10}}>
            <button className="btn" onClick={run}>Run query</button>
            <button className="btn alt" onClick={resetDb}>Reset database</button>
          </div>
          {error && <div className="err">{error}</div>}
          {result && (
            result.columns.length===0 ? <p className="muted small" style={{marginTop:10}}>No rows returned.</p> : (
              <div className="resultwrap">
                <table>
                  <thead><tr>{result.columns.map(c=><th key={c}>{c}</th>)}</tr></thead>
                  <tbody>{result.values.map((row,i)=>(
                    <tr key={i}>{row.map((v,j)=><td key={j}>{v===null?'NULL':String(v)}</td>)}</tr>
                  ))}</tbody>
                </table>
              </div>
            )
          )}
          <div className="card" style={{marginTop:16}}>
            <h3>Schema</h3>
            <Code text={`customers(id, name, city, segment)
orders(id, customer_id, order_date, amount, category)`}/>
          </div>
        </div>
      )}
    </div>
  );
}

        <h4>Deliverable</h4><p style={{margin:0}}>{p.deliver}</p>

        <NotesField value={progress.notes['proj-'+p.id]} onChange={v=>onNote('proj-'+p.id,v)}/>
      </div>
    </details>
  );
}

/* ---- practice ---- */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function Quiz({progress,setProgress}){
  const [cat,setCat]=useState('All');
  const [missedOnly,setMissedOnly]=useState(false);
  const [session,setSession]=useState(null);
  const cats=['All',...new Set(QUIZ.map(q=>q.c))];
  const withIdx=QUIZ.map((q,i)=>({...q,idx:i}));
  const missedCount=withIdx.filter(q=>progress.quizWrong[q.idx]>0).length;

  function pool(){
    let base=cat==='All'?withIdx:withIdx.filter(q=>q.c===cat);
    if(missedOnly) base=base.filter(q=>progress.quizWrong[q.idx]>0);
    return base;
  }
  if(!session){
    const best=progress.best[(missedOnly?'missed-':'')+cat];
    const count=pool().length;
    return (
      <div className="qbox">
        <div className="filters">{cats.map(c=><button key={c} className="pill" aria-pressed={c===cat} onClick={()=>setCat(c)}>{c}</button>)}</div>
        <div className="filters">
          <button className="pill" aria-pressed={!missedOnly} onClick={()=>setMissedOnly(false)}>All questions</button>
          <button className="pill" aria-pressed={missedOnly} onClick={()=>setMissedOnly(true)}>Missed questions only ({missedCount})</button>
        </div>
        <div className="card">
          <p style={{margin:'0 0 12px'}}>{count} question{count===1?'':'s'}{best!=null?` \u00b7 Best score: ${best}%`:''}</p>
          {count===0 ? <p className="muted small">No missed questions here yet \u2014 nice.</p> : (
            <button className="btn" onClick={()=>setSession({list:shuffle(pool()),i:0,score:0,sel:null})}>Start quiz</button>
          )}
        </div>
      </div>
    );
  }
  if(session.i>=session.list.length){
    const pct=Math.round(100*session.score/session.list.length);
    const msg=pct>=80?'Strong. Move on to the projects.':pct>=50?'Solid start. Review the explanations you missed.':'Revisit the roadmap for this topic, then retry.';
    const key=(missedOnly?'missed-':'')+cat;
    return (
      <div className="qbox card">
        <p className="muted" style={{margin:0}}>Your score</p>
        <div className="big">{session.score}/{session.list.length}</div>
        <p style={{margin:'10px 0 16px'}}>{msg}</p>
        <button className="btn" onClick={()=>{
          if(progress.best[key]==null||pct>progress.best[key]) setProgress(p=>({...p,best:{...p.best,[key]:pct}}));
          setSession({list:shuffle(pool()),i:0,score:0,sel:null});
        }}>Try again</button>{' '}
        <button className="btn alt" onClick={()=>{
          if(progress.best[key]==null||pct>progress.best[key]) setProgress(p=>({...p,best:{...p.best,[key]:pct}}));
          setSession(null);
        }}>Change topic</button>
      </div>
    );
  }
  const q=session.list[session.i];
  return (
    <div className="qbox card">
      <div className="qmeta"><span>{q.c}</span><span>Question {session.i+1} of {session.list.length}</span></div>
      <h3 style={{marginBottom:14,fontSize:'1.15rem'}}>{q.q}</h3>
      {q.o.map((o,i)=>{
        let cls='';
        if(session.sel!=null){ if(i===q.a) cls='ok'; else if(i===session.sel) cls='bad'; }
        return (
          <button key={i} className={"opt "+cls} disabled={session.sel!=null} onClick={()=>{
            const sel=i, correct=i===q.a, sc=session.score+(correct?1:0);
            if(!correct){
              setProgress(p=>({...p,quizWrong:{...p.quizWrong,[q.idx]:(p.quizWrong[q.idx]||0)+1}}));
            } else if(progress.quizWrong[q.idx]){
              setProgress(p=>{const qw={...p.quizWrong};delete qw[q.idx];return {...p,quizWrong:qw}});
            }
            setSession({...session,sel,score:sc});
          }}>{o}</button>
        );
      })}
      {session.sel!=null && (
        <>
          <div className="expl"><strong>{session.sel===q.a?'Correct.':'Not quite.'}</strong> {q.e}</div>
          <button className="btn" onClick={()=>setSession({...session,i:session.i+1,sel:null})}>{session.i+1<session.list.length?'Next question':'See score'}</button>
        </>
      )}
    </div>
  );
}
function Exercises(){
  return (
    <div>
      {EXERCISES.map((e,i)=>(

          <summary><span className="dn">{e.c}</span><span className="ttl">{e.t}</span></summary>

function Practice({progress,setProgress}){

/* ---- cheatsheets ---- */
function Cheats(){
  const [cat,setCat]=useState('Excel');
  const [q,setQ]=useState('');
  const query=q.trim().toLowerCase();
  const items=query
    ? Object.entries(CHEATS).flatMap(([k,v])=>v.map(x=>[k,...x])).filter(x=>(x[1]+x[2]).toLowerCase().includes(query))
    : CHEATS[cat].map(x=>[cat,...x]);
  return (
    <div>
      <div className="sec-head"><h2>Cheatsheets</h2><p>Copy-ready snippets for the things analysts type every day, across all four tools.</p></div>
      <div className="filters">
        {Object.keys(CHEATS).map(c=>(
          <button key={c} className="pill" aria-pressed={!query&&c===cat} onClick={()=>{setCat(c);setQ('')}}>{c}</button>
        ))}
        <input type="search" placeholder="Search all snippets (e.g. merge, XLOOKUP, CALCULATE)" value={q} onChange={e=>setQ(e.target.value)} aria-label="Search snippets"/>
      </div>
      {items.length===0 ? <p className="muted">Nothing matches "{q}". Try a shorter word.</p> : (
        <div className="cheat-grid">
          {items.map((x,i)=>(
            <div className="card" key={i}>
              <h3>{x[1]}</h3>
              {query && <span className="chip">{x[0]}</span>}
              <Code text={x[2]}/>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---- career: resume generator ---- */
function genBullets(p){
  const skills=p.skills.join(', ');
  const talk=p.talk.replace(/^"|"$/g,'');
  return [
    `Built ${p.name.toLowerCase()} using ${skills}, delivering ${p.deliver.toLowerCase()}.`,
    `Applied ${p.skills[0]}${p.skills[1]?(' and '+p.skills[1]):''} on ${p.data.toLowerCase()} to uncover actionable insights for stakeholders.`,
    talk.charAt(0).toUpperCase()+talk.slice(1)
  ];
}
function ResumeGenerator(){
  const [pid,setPid]=useState(PROJECTS[3].id);
  const p=PROJECTS.find(x=>x.id===pid);
  const bullets=genBullets(p);
  return (
    <div className="card">
      <h3>Resume bullet generator</h3>
      <p className="muted small">Pick a project, get draft bullets, then edit in your own words and add your real numbers.</p>
      <select value={pid} onChange={e=>setPid(e.target.value)} style={{marginTop:6}}>
        {PROJECTS.map(pr=><option key={pr.id} value={pr.id}>{pr.name}</option>)}
      </select>
      <div style={{marginTop:12}}>
        {bullets.map((b,i)=>(
          <div key={i} style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:8}}>
            <p style={{margin:0,flex:1,fontSize:'.9rem'}}>{'\u2022 '+b}</p>
            <button className="btn alt sm" onClick={(e)=>copyText(b,e.currentTarget)}>Copy</button>
          </div>
        ))}
      </div>
    </div>
  );
}
function JdMatcher(){
  const [jd,setJd]=useState('');
  const lower=jd.toLowerCase();
  const matched=KEYWORDS.filter(k=>lower.includes(k.toLowerCase()));
  const missing=KEYWORDS.filter(k=>!lower.includes(k.toLowerCase()));
  return (
    <div className="card">
      <h3>Job description keyword matcher</h3>
      <p className="muted small">Paste a job description. See which analyst keywords it mentions, and which ones you might be missing from your resume.</p>
      <textarea style={{width:'100%',minHeight:110,marginTop:6}} value={jd} onChange={e=>setJd(e.target.value)} placeholder="Paste a job description here..."/>
      {jd.trim() && (
        <div style={{marginTop:12}}>
          <p className="small" style={{margin:'0 0 6px'}}><strong>Matched ({matched.length})</strong></p>
          <div className="kwgrid">{matched.length?matched.map(k=><span key={k} className="chip kw-yes">{k}</span>):<span className="small muted">None yet</span>}</div>
          <p className="small" style={{margin:'12px 0 6px'}}><strong>Consider adding ({missing.length})</strong></p>
          <div className="kwgrid">{missing.map(k=><span key={k} className="chip kw-no">{k}</span>)}</div>
        </div>
      )}
    </div>
  );
}
function AppTracker({progress,setProgress}){
  const [form,setForm]=useState({company:'',role:'',date:todayStr(),status:'Applied'});
  function add(){
    if(!form.company.trim()) { toast('Add a company name first'); return; }
    setProgress(p=>({...p,apps:[...p.apps,{...form,id:Date.now()}]}));
    setForm({company:'',role:'',date:todayStr(),status:'Applied'});
  }
  function remove(id){
    setProgress(p=>({...p,apps:p.apps.filter(a=>a.id!==id)}));
  }
  function setStatus(id,status){
    setProgress(p=>({...p,apps:p.apps.map(a=>a.id===id?{...a,status}:a)}));
  }
  return (
    <div className="card">
      <h3>Application tracker ({progress.apps.length})</h3>
      <div className="appform">
        <input type="text" placeholder="Company" value={form.company} onChange={e=>setForm({...form,company:e.target.value})}/>
        <input type="text" placeholder="Role" value={form.role} onChange={e=>setForm({...form,role:e.target.value})}/>
        <input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/>
        <select value={form.status} onChange={e=>setForm({...form,status:e.target.value})}>
          {['Applied','Interviewing','Offer','Rejected'].map(s=><option key={s}>{s}</option>)}
        </select>
        <button className="btn sm" onClick={add}>Add</button>
      </div>
      {progress.apps.length>0 && (
        <div style={{overflowX:'auto'}}>
          <table className="apptable">
            <thead><tr><th>Company</th><th>Role</th><th>Date</th><th>Status</th><th></th></tr></thead>
            <tbody>
              {progress.apps.map(a=>(
                <tr key={a.id}>
                  <td>{a.company}</td><td>{a.role||'\u2014'}</td><td>{a.date}</td>
                  <td><select value={a.status} onChange={e=>setStatus(a.id,e.target.value)}>{['Applied','Interviewing','Offer','Rejected'].map(s=><option key={s}>{s}</option>)}</select></td>
                  <td><button className="del" onClick={()=>remove(a.id)} aria-label="Remove">\u2715</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ================= app ================= */
function App(){
  const [view,setView]=useState('home');
  const [progress,setProgress]=useState(loadState());
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('ap2-theme')||''}catch(e){return ''}});

  useEffect(()=>{saveState(progress)},[progress]);
  useEffect(()=>{
    if(theme) document.documentElement.setAttribute('data-theme',theme);
    try{localStorage.setItem('ap2-theme',theme)}catch(e){}
  },[theme]);

  function toggle(section,key){
    setProgress(p=>{
      const willBeOn=!p[section][key];
      const next={...p,[section]:{...p[section],[key]:willBeOn}};
      if(willBeOn) next.activity={...p.activity,[todayStr()]:true};
      return next;
    });
  }
  function setNote(key,value){
    setProgress(p=>({...p,notes:{...p.notes,[key]:value}}));
  }
  const stepCount=useMemo(()=>PROJECTS.reduce((n,p)=>n+p.steps.length,0),[]);
  const careerCount=useMemo(()=>Object.values(CAREER).reduce((n,a)=>n+a.length,0),[]);
  const all=TOTAL_DAYS+stepCount+careerCount;
  const done=Object.values(progress.days).filter(Boolean).length+Object.values(progress.steps).filter(Boolean).length+Object.values(progress.career).filter(Boolean).length;
  const pct=Math.round(100*done/all)||0;
  const nextDay=(()=>{for(let i=1;i<=TOTAL_DAYS;i++) if(!progress.days[i]) return i; return null})();

  useEffect(()=>{window.scrollTo(0,0)},[view]);

  let body;
  if(view==='home') body=<Home setView={setView} pct={pct} nextDay={nextDay} progress={progress} setProgress={setProgress}/>;
  else if(view==='roadmap') body=<Roadmap progress={progress} toggle={toggle} setNote={setNote}/>;
  else if(view==='sql') body=<SqlSandbox/>;
  else if(view==='projects') body=<Projects progress={progress} toggle={toggle} setNote={setNote}/>;
  else if(view==='practice') body=<Practice progress={progress} setProgress={setProgress}/>;
  else if(view==='cheats') body=<Cheats/>;
  else if(view==='interview') body=<Interview progress={progress} toggle={toggle}/>;
  else body=<Career progress={progress} toggle={toggle} setProgress={setProgress}/>;

  return (
    <React.Fragment>
      <Header view={view} setView={setView} pct={pct} theme={theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')} setTheme={setTheme}/>
      <main><div className="wrap">{body}</div></main>
      <footer><div className="wrap">Built with React. Your progress is saved in this browser only \u2014 export it from the Start tab to back it up, or clearing site data resets it.</div></footer>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
